{% extends "base.html" %}

{% block title %}Edit profile • Instagram{% endblock %}

{% block content %}
    <section class="edit-profile-page">
        <header class="edit-profile-heading">
            <a class="back-link" href="{{ url_for('profile') }}" aria-label="Back to profile">‹</a>
            <h1>Edit profile</h1>
        </header>

        <form class="edit-profile-form" method="POST"
              action="{{ url_for('edit_profile') }}" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="edit-avatar-row">
                {% if user.profile_picture %}
                    <img class="edit-avatar"
                         src="{{ url_for('uploaded_profile_picture', filename=user.profile_picture) }}"
                         alt="{{ user.username }}'s profile picture"
                         onerror="this.onerror=null;this.src='{{ url_for('static', filename='images/default-avatar.svg') }}';">
                {% else %}
                    <img class="edit-avatar"
                         src="{{ url_for('static', filename='images/default-avatar.svg') }}"
                         alt="Default profile picture">
                {% endif %}
                <div class="edit-avatar-details">
                    <strong>{{ user.username }}</strong>
                    <label class="upload-picture-label" for="profile_picture">Change profile photo</label>
                    <input class="picture-input" type="file" id="profile_picture"
                           name="profile_picture" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                    <small>JPG or PNG, up to 5 MB.</small>
                </div>
            </div>

            <div class="edit-field">
                <label for="display_name">Display name</label>
                <input type="text" id="display_name" name="display_name"
                       value="{{ form_data.get('display_name', user.display_name or '') }}"
                       maxlength="80" autocomplete="name">
            </div>

            <div class="edit-field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       value="{{ form_data.get('username', user.username) }}"
                       maxlength="80" autocomplete="username" required>
            </div>

            <div class="edit-field">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" rows="4" maxlength="150"
                          aria-describedby="bio-hint">{{ form_data.get('bio', user.bio or '') }}</textarea>
                <small id="bio-hint">Up to 150 characters.</small>
            </div>

            <div class="edit-field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email"
                       value="{{ form_data.get('email', user.email) }}"
                       maxlength="120" autocomplete="email" required>
            </div>

            <div class="edit-form-actions">
                <button class="profile-button save-profile-button" type="submit">Save changes</button>
                <a class="cancel-profile-button" href="{{ url_for('profile') }}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
